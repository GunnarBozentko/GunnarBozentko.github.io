<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gunnar Bozentko — Resume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #16181c;
      --muted: #5a6169;
      --rule: #d8dce0;
      --accent-strong: #ef0107;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f3f4f6;
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 11.5px;
      line-height: 1.25;
    }

    .toolbar {
      position: sticky;
      top: 0;
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      padding: 0.75rem;
      background: #16181c;
    }

    .toolbar a, .toolbar button {
      font-family: "Inter", system-ui, sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.55rem 1.1rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      text-decoration: none;
    }

    .toolbar button {
      background: var(--accent-strong);
      color: #fff;
    }

    .toolbar a {
      background: transparent;
      color: #cfd3d8;
      border: 1px solid #3a3f47;
    }

    .page {
      max-width: 760px;
      margin: 2rem auto;
      background: #fff;
      padding: 0.75in 0.75in;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.15);
    }

    h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: 1.5rem;
      margin: 0 0 0.08rem;
    }

    .contact-line {
      color: var(--muted);
      font-size: 0.8rem;
      margin: 0 0 0.7rem;
    }

    .contact-line a {
      color: var(--ink);
      text-decoration: none;
    }

    h2 {
      font-family: "Space Grotesk", sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--accent-strong);
      border-bottom: 1.5px solid var(--rule);
      padding-bottom: 0.1rem;
      margin: 0 0 0.3rem;
    }

    section.resume-section {
      margin-bottom: 0.45rem;
    }

    .resume-entry {
      margin-bottom: 0.25rem;
    }

    .resume-entry:last-child {
      margin-bottom: 0;
    }

    .resume-entry-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
    }

    .resume-entry-header h3 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .resume-entry-dates {
      font-family: "Space Grotesk", sans-serif;
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .resume-entry-org {
      margin: 0.05rem 0 0.15rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .resume-entry ul {
      margin: 0.15rem 0 0;
      padding-left: 1.1rem;
    }

    .resume-entry li {
      margin-bottom: 0.08rem;
      font-size: 0.86rem;
    }

    .skill-line {
      margin: 0 0 0.2rem;
      font-size: 0.86rem;
    }

    .skill-line:last-child {
      margin-bottom: 0;
    }

    .skill-line strong {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 600;
    }

    .empty-state {
      color: var(--muted);
    }

    @media print {
      body { background: #fff; }
      .toolbar { display: none; }
      .page {
        margin: 0;
        box-shadow: none;
        padding: 0;
        max-width: none;
      }
      @page { margin: 0.5in; }
    }
  </style>
</head>
<body>

  <div class="toolbar no-print">
    <button onclick="window.print()">Download / Print PDF</button>
    <a href="resume.html">Back to site</a>
  </div>

  <main class="page">
    <h1>Gunnar Bozentko</h1>
    <p class="contact-line">
      203-364-7230
      &middot;
      <a href="mailto:gunnarbozentko@mines.edu">gunnarbozentko@mines.edu</a>
      &middot;
      <a href="https://www.linkedin.com/in/gunnar-bozentko-64283426b/">linkedin.com/in/gunnar-bozentko</a>
      &middot;
      <a href="https://github.com/GunnarBozentko">github.com/GunnarBozentko</a>
    </p>

    <div id="resume-content">
      <p class="empty-state">Loading&hellip;</p>
    </div>
  </main>

  <script src="csv.js"></script>
  <script src="resume-print.js"></script>
</body>
</html>
